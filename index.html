<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Finance Tracker</title>
  
  <!-- PWA & iOS 設定 -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Finance">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { -webkit-tap-highlight-color: transparent; }
    /* モーダルのアニメーション用 */
    @keyframes fadeInZoom {
      0% { opacity: 0; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1); }
    }
    .animate-in { animation: fadeInZoom 0.2s ease-out forwards; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    // --- Helper Functions ---
    const formatCurrency = (amount) => {
      return new Intl.NumberFormat('ja-JP', {
        style: 'currency',
        currency: 'JPY',
      }).format(amount);
    };

    const calculateDaysRemaining = (dateString) => {
      if (!dateString) return null;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const targetDate = new Date(dateString);
      targetDate.setHours(0, 0, 0, 0);
      
      const diffTime = targetDate.getTime() - today.getTime();
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      return diffDays;
    };

    // --- SVG Icons ---
    const Icons = {
      Plus: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
      Trash: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>,
      Edit: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>,
      CheckCircle: ({ active }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill={active ? "#10B981" : "none"} stroke={active ? "#10B981" : "currentColor"} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01" stroke={active ? "#fff" : "currentColor"}></polyline></svg>,
      Calendar: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>,
      Income: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>,
      Expense: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"></polyline><polyline points="17 18 23 18 23 12"></polyline></svg>,
      Clock: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
    };

    function App() {
      // 初期データの読み込み（ローカルストレージ優先）
      const loadInitialData = () => {
        const saved = localStorage.getItem('financeTrackerData');
        if (saved) {
          return JSON.parse(saved);
        }
        return [
          { id: '1', type: 'income', title: '給与', amount: 320000, date: '2026-09-25', memo: '基本給' },
          { id: '2', type: 'fixed', title: '家賃', amount: 85000, date: '2026-09-27', memo: '' },
          { id: '3', type: 'subscription', title: 'Netflix', amount: 1490, date: '2026-09-10', memo: '' },
          { id: '5', type: 'bill', title: '楽天カード', amount: 45000, date: '2026-09-27', isPaid: false, memo: '日用品・食費' },
          { id: '6', type: 'bill', title: '住民税 第2期', amount: 21000, date: '2026-09-02', isPaid: true, memo: '' },
        ];
      };

      const [transactions, setTransactions] = useState(loadInitialData);
      const [activeTab, setActiveTab] = useState('all'); 
      const [isModalOpen, setIsModalOpen] = useState(false);
      
      // フォームデータの状態管理 (メモ・IDを含む)
      const [formData, setFormData] = useState({ id: null, title: '', amount: '', date: '', type: 'fixed', memo: '' });

      // データが変更されるたびにローカルストレージに保存
      useEffect(() => {
        localStorage.setItem('financeTrackerData', JSON.stringify(transactions));
      }, [transactions]);

      // 残高・収入・支出などの計算
      const summary = useMemo(() => {
        let totalIncome = 0;
        let totalExpense = 0;
        let pendingBills = 0;

        transactions.forEach(t => {
          if (t.type === 'income') {
            totalIncome += Number(t.amount);
          } else {
            totalExpense += Number(t.amount);
            if (t.type === 'bill' && !t.isPaid) {
              pendingBills += Number(t.amount);
            }
          }
        });

        return {
          income: totalIncome,
          expense: totalExpense,
          balance: totalIncome - totalExpense,
          pendingBills
        };
      }, [transactions]);

      // タブごとの表示データ絞り込み
      const filteredTransactions = useMemo(() => {
        let filtered = [...transactions];
        if (activeTab === 'bills') filtered = filtered.filter(t => t.type === 'bill');
        if (activeTab === 'fixed') filtered = filtered.filter(t => t.type === 'fixed');
        if (activeTab === 'subs') filtered = filtered.filter(t => t.type === 'subscription');
        return filtered.sort((a, b) => new Date(a.date) - new Date(b.date));
      }, [transactions, activeTab]);

      // モーダルを開く（新規追加 or 編集）
      const handleOpenModal = (type, item = null) => {
        if (item) {
          // 編集時：既存データをセット
          setFormData({
            id: item.id,
            type: item.type,
            title: item.title,
            amount: item.amount,
            date: item.date,
            memo: item.memo || ''
          });
        } else {
          // 新規追加時：空のデータをセット
          setFormData({ 
            id: null, 
            title: '', 
            amount: '', 
            date: new Date().toISOString().split('T')[0], 
            type: type, 
            memo: '' 
          });
        }
        setIsModalOpen(true);
      };

      const handleCloseModal = () => {
        setIsModalOpen(false);
      };

      // フォーム入力時の処理
      const handleInputChange = (e) => {
        const { name, value } = e.target;
        setFormData(prev => ({ ...prev, [name]: value }));
      };

      // 保存ボタンを押した時の処理
      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.title || !formData.amount || !formData.date) return;

        if (formData.id) {
          // 既存データの更新（編集）
          setTransactions(prev => prev.map(t => {
            if (t.id === formData.id) {
              return { 
                ...t, 
                type: formData.type, 
                title: formData.title, 
                amount: Number(formData.amount), 
                date: formData.date, 
                memo: formData.memo 
              };
            }
            return t;
          }));
        } else {
          // 新規データの追加
          const newItem = {
            id: Date.now().toString(),
            type: formData.type,
            title: formData.title,
            amount: Number(formData.amount),
            date: formData.date,
            memo: formData.memo,
            ...(formData.type === 'bill' ? { isPaid: false } : {})
          };
          setTransactions(prev => [...prev, newItem]);
        }
        handleCloseModal();
      };

      const handleDelete = (id) => {
        if (window.confirm("本当に削除しますか？")) {
          setTransactions(prev => prev.filter(t => t.id !== id));
        }
      };

      const handleTogglePaid = (id) => {
        setTransactions(prev => prev.map(t => {
          if (t.id === id) {
            return { ...t, isPaid: !t.isPaid };
          }
          return t;
        }));
      };

      return (
        <div className="min-h-screen pb-24 md:pb-10 relative">
          
          {/* Header */}
          <header className="bg-white px-6 py-5 shadow-sm sticky top-0 z-10">
            <div className="max-w-3xl mx-auto flex items-center justify-between">
              <div>
                <h1 className="text-2xl font-bold text-slate-800 tracking-tight">Finance Tracker</h1>
                <p className="text-sm text-slate-500 mt-1">収支・支払い管理</p>
              </div>
              <div className="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600">
                <Icons.Calendar />
              </div>
            </div>
          </header>

          <main className="max-w-3xl mx-auto px-4 sm:px-6 py-6 space-y-8">
            
            {/* Dashboard Cards */}
            <section className="grid grid-cols-2 gap-4">
              <div className="col-span-2 bg-gradient-to-br from-slate-800 to-slate-900 rounded-2xl p-6 text-white shadow-xl">
                <p className="text-slate-300 text-sm font-medium mb-1">今月の残高予測</p>
                <h2 className="text-4xl font-bold tracking-tight mb-4">{formatCurrency(summary.balance)}</h2>
                <div className="flex items-center gap-6 text-sm">
                  <div>
                    <p className="text-slate-400 flex items-center gap-1 mb-1"><Icons.Income /> 総収入</p>
                    <p className="font-semibold text-emerald-400">{formatCurrency(summary.income)}</p>
                  </div>
                  <div className="w-px h-8 bg-slate-700"></div>
                  <div>
                    <p className="text-slate-400 flex items-center gap-1 mb-1"><Icons.Expense /> 総支出</p>
                    <p className="font-semibold text-rose-400">{formatCurrency(summary.expense)}</p>
                  </div>
                </div>
              </div>

              <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-center">
                <p className="text-slate-500 text-xs font-medium mb-1">未払いの期日支払い</p>
                <p className="text-2xl font-bold text-rose-600">{formatCurrency(summary.pendingBills)}</p>
              </div>
              
              <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-center cursor-pointer hover:bg-slate-50 transition-colors" onClick={() => handleOpenModal('bill')}>
                <div className="w-full h-full flex flex-col items-center justify-center text-blue-600 py-2">
                  <div className="bg-blue-50 p-2 rounded-full mb-2">
                    <Icons.Plus />
                  </div>
                  <span className="text-sm font-bold">支払いを追加</span>
                </div>
              </div>
            </section>

            {/* Quick Add Buttons */}
            <section className="grid grid-cols-3 gap-3">
              <button onClick={() => handleOpenModal('income')} className="bg-white border border-slate-200 py-3 rounded-xl text-sm font-medium text-slate-700 hover:bg-slate-50 flex items-center justify-center gap-2 shadow-sm">
                <span className="text-emerald-500 font-bold">+</span> 収入
              </button>
              <button onClick={() => handleOpenModal('fixed')} className="bg-white border border-slate-200 py-3 rounded-xl text-sm font-medium text-slate-700 hover:bg-slate-50 flex items-center justify-center gap-2 shadow-sm">
                <span className="text-rose-500 font-bold">+</span> 固定費
              </button>
              <button onClick={() => handleOpenModal('subscription')} className="bg-white border border-slate-200 py-3 rounded-xl text-sm font-medium text-slate-700 hover:bg-slate-50 flex items-center justify-center gap-2 shadow-sm">
                <span className="text-indigo-500 font-bold">+</span> サブスク
              </button>
            </section>

            {/* Transaction List */}
            <section>
              <div className="flex space-x-1 bg-slate-200/50 p-1 rounded-xl mb-6 overflow-x-auto">
                {[ { id: 'all', label: 'すべて' }, { id: 'bills', label: '期日支払い' }, { id: 'fixed', label: '固定費' }, { id: 'subs', label: 'サブスク' } ].map(tab => (
                  <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex-1 min-w-[80px] py-2 px-3 text-sm font-medium rounded-lg transition-all ${activeTab === tab.id ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>
                    {tab.label}
                  </button>
                ))}
              </div>

              <div className="space-y-3">
                {filteredTransactions.length === 0 ? (
                  <div className="text-center py-10 bg-white rounded-2xl border border-dashed border-slate-300">
                    <p className="text-slate-400 text-sm">データがありません</p>
                  </div>
                ) : (
                  filteredTransactions.map(item => {
                    const daysRemaining = item.type === 'bill' ? calculateDaysRemaining(item.date) : null;
                    const isOverdue = daysRemaining !== null && daysRemaining < 0 && !item.isPaid;
                    
                    return (
                      <div key={item.id} className={`bg-white p-4 rounded-2xl shadow-sm border ${isOverdue ? 'border-rose-200 bg-rose-50/30' : 'border-slate-100'} flex items-start justify-between gap-4 transition-all hover:shadow-md`}>
                        {/* 完了ボタン (期日払いのみ) */}
                        {item.type === 'bill' && (
                          <button onClick={() => handleTogglePaid(item.id)} className="flex-shrink-0 mt-1 focus:outline-none">
                            <Icons.CheckCircle active={item.isPaid} />
                          </button>
                        )}
                        
                        {/* メイン情報 */}
                        <div className="flex-1 min-w-0">
                          <div className="flex items-center gap-2 mb-1">
                            <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold ${
                              item.type === 'income' ? 'bg-emerald-100 text-emerald-700' :
                              item.type === 'fixed' ? 'bg-slate-100 text-slate-700' :
                              item.type === 'subscription' ? 'bg-indigo-100 text-indigo-700' :
                              item.isPaid ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'
                            }`}>
                              {item.type === 'income' ? '収入' : item.type === 'fixed' ? '固定費' : item.type === 'subscription' ? 'サブスク' : '期日払い'}
                            </span>
                            {item.type === 'bill' && !item.isPaid && (
                              <span className={`text-[10px] font-bold flex items-center gap-1 ${isOverdue ? 'text-rose-600' : 'text-amber-600'}`}>
                                <Icons.Clock />
                                {isOverdue ? `${Math.abs(daysRemaining)}日超過` : daysRemaining === 0 ? '今日が期日' : `あと${daysRemaining}日`}
                              </span>
                            )}
                          </div>
                          <h3 className={`font-bold text-slate-800 truncate ${item.type === 'bill' && item.isPaid ? 'line-through text-slate-400' : ''}`}>
                            {item.title}
                          </h3>
                          <p className="text-xs text-slate-400 mt-1">{item.date}</p>
                          
                          {/* メモの表示 */}
                          {item.memo && (
                            <p className="text-xs text-slate-500 mt-2 bg-slate-50 p-2 rounded border border-slate-100 break-words">
                              {item.memo}
                            </p>
                          )}
                        </div>
                        
                        {/* 金額とアクションボタン */}
                        <div className="text-right flex-shrink-0 flex flex-col items-end gap-2">
                          <span className={`font-bold ${item.type === 'income' ? 'text-emerald-600' : (item.type === 'bill' && item.isPaid) ? 'text-slate-400' : 'text-slate-800'}`}>
                            {item.type === 'income' ? '+' : '-'}{formatCurrency(item.amount)}
                          </span>
                          <div className="flex items-center gap-1 mt-1">
                            <button onClick={() => handleOpenModal(item.type, item)} className="text-slate-300 hover:text-blue-500 transition-colors p-1" aria-label="編集">
                              <Icons.Edit />
                            </button>
                            <button onClick={() => handleDelete(item.id)} className="text-slate-300 hover:text-rose-500 transition-colors p-1" aria-label="削除">
                              <Icons.Trash />
                            </button>
                          </div>
                        </div>
                      </div>
                    );
                  })
                )}
              </div>
            </section>
          </main>

          {/* 追加・編集モーダル（インライン展開によりフォーカス外れを防止） */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
              <div className="bg-white rounded-2xl w-full max-w-md p-6 shadow-xl animate-in">
                <div className="flex justify-between items-center mb-6">
                  <h2 className="text-xl font-bold text-gray-800">
                    {formData.id ? '編集する' : '追加する'}
                  </h2>
                  <button onClick={handleCloseModal} className="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
                </div>

                <form onSubmit={handleSubmit} className="space-y-4">
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">種類</label>
                    <select name="type" value={formData.type} onChange={handleInputChange} className="w-full border border-gray-300 rounded-xl p-3 bg-gray-50 text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500">
                      <option value="income">収入</option>
                      <option value="fixed">固定費</option>
                      <option value="subscription">サブスクリプション</option>
                      <option value="bill">期日指定の支払い</option>
                    </select>
                  </div>
                  
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">項目名</label>
                    <input type="text" name="title" required placeholder="例: 家賃、Netflix、電気代..." value={formData.title} onChange={handleInputChange} className="w-full border border-gray-300 rounded-xl p-3 text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500"/>
                  </div>
                  
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">金額 (円)</label>
                    <input type="number" name="amount" required min="0" placeholder="0" value={formData.amount} onChange={handleInputChange} className="w-full border border-gray-300 rounded-xl p-3 text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500"/>
                  </div>
                  
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">
                      {formData.type === 'bill' ? '支払期日' : '発生日 / 引落日'}
                    </label>
                    <input type="date" name="date" required value={formData.date} onChange={handleInputChange} className="w-full border border-gray-300 rounded-xl p-3 text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500"/>
                  </div>

                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">メモ (任意)</label>
                    <textarea name="memo" rows="2" placeholder="詳細や備考を入力..." value={formData.memo} onChange={handleInputChange} className="w-full border border-gray-300 rounded-xl p-3 text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
                  </div>

                  <div className="pt-4 flex gap-3">
                    <button type="button" onClick={handleCloseModal} className="flex-1 px-4 py-3 border border-gray-300 text-gray-700 rounded-xl font-medium hover:bg-gray-50 transition-colors">キャンセル</button>
                    <button type="submit" className="flex-1 px-4 py-3 bg-blue-600 text-white rounded-xl font-medium hover:bg-blue-700 transition-colors shadow-lg shadow-blue-200">保存する</button>
                  </div>
                </form>
              </div>
            </div>
          )}
          
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
